spring:
  application:
    name: currency-conversion
  cloud:
    config:
      enabled: false

server:
  port: 8100

management:
  tracing:
    sampling:
      probability: 1.0
  #zipkin:
    #tracing:
      #endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true