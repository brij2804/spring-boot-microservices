spring:
  application:
    name: currency-exchange
  cloud:
    config:
      enabled: false
  datasource:
    platform: h2
    url: jdbc:h2:mem:testdb
  jpa:
    show-sql: true
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true

server:
  port: 8000

management:
  tracing:
    sampling:
      probability: 1.0
  #zipkin:
    #tracing:
      #endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true

resilience4j:
  retry:
    instances:
      sample-api:
        maxAttempts: 5
        waitDuration: 5s